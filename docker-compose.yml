
services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: dev-root-password
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: dev-nextcloud-password
    volumes:
      - nextcloud_db:/var/lib/mysql
    networks:
      - recognaize-dev

  # One-shot init: bind-mounting ./recognaize_bridge into a *subpath* of the nextcloud_html
  # named volume (below) makes Docker create the missing "custom_apps" parent as root before
  # the nextcloud image's own entrypoint gets a chance to own it - occ then fails installing
  # any non-shipped app (e.g. "recognize") into it with a misleading "Cannot write into apps
  # directory" error, since custom_apps (not apps) is the actual writable install root
  # (confirmed via `\OC::$APPSROOTS`). Fixed here, once, before nextcloud starts, rather than
  # as a corrective step in dev-setup.sh - reusing the nextcloud image so www-data's uid/gid
  # matches exactly.
  fix-permissions:
    image: nextcloud:33-apache
    entrypoint: ["sh", "-c", "mkdir -p /var/www/html/custom_apps && chown www-data:www-data /var/www/html/custom_apps"]
    volumes:
      - nextcloud_html:/var/www/html
    networks:
      - recognaize-dev

  nextcloud:
    image: nextcloud:33-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
      fix-permissions:
        condition: service_completed_successfully
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: dev-nextcloud-password
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: dev-admin-password
      # "nextcloud" (the compose service/container name) must be trusted too, not just
      # localhost: the recognaize container calls back into Nextcloud via NEXTCLOUD_URL=
      # http://nextcloud (nc_py_api's set_init_status et al.), and Nextcloud's untrusted-domain
      # guard 400s that Host header otherwise - found by chasing a 400 on PUT
      # /ocs/v1.php/apps/app_api/ex-app/status back to an HTML "Access through untrusted domain"
      # page, not the JSON/auth error it looked like at first.
      NEXTCLOUD_TRUSTED_DOMAINS: localhost nextcloud
    ports:
      - "8080:80"
    volumes:
      - nextcloud_html:/var/www/html
      # Bind-mount recognaize_bridge straight from the repo so local edits show up without a
      # copy step (occ app:enable still needs running once - see README's "Try it locally").
      - ./recognaize_bridge:/var/www/html/custom_apps/recognaize_bridge
    networks:
      - recognaize-dev

  recognaize:
    build: .
    restart: unless-stopped
    environment:
      APP_ID: recognaize
      APP_VERSION: "0.1.0"
      APP_SECRET: dev-secret-not-for-real-use
      # No HP_SHARED_KEY/HP_FRP_* here on purpose: those trigger HaRP/FRP-tunnel mode, which
      # only exists to cross a network boundary HaRP sits in front of. On this compose network,
      # Nextcloud can reach this container directly, so plain TCP is enough - see
      # ex_app/lib/main.py + nc_py_api's run_app(), which binds a TCP socket on
      # APP_HOST:APP_PORT whenever HP_SHARED_KEY is absent (unix socket + frpc otherwise).
      APP_HOST: 0.0.0.0
      APP_PORT: "9030"
      NEXTCLOUD_URL: http://nextcloud
    networks:
      - recognaize-dev

networks:
  recognaize-dev:

volumes:
  nextcloud_db:
  nextcloud_html:
